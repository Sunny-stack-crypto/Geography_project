<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="地理総合の授業で使うGISと学習内容のページです。">
  <title>地理総合｜GIS</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="gis.html">地理総合の学び</a>
    <nav aria-label="メインナビゲーション">
      <a class="nav-link" href="index.html">ホーム</a>
      <a class="nav-link active" href="gis.html" aria-current="page">GIS</a>
      <a class="nav-link" href="after.html">授業感想</a>
    </nav>
  </header>

  <main class="page-content">
    <section class="intro">
      <p class="eyebrow">GEOGRAPHY</p>
      <h1>地図から、地域を見つめよう。</h1>
      <p>地図やデータを使って、身近な地域や世界の課題を考えてみましょう。</p>

      <section class="card" aria-labelledby="gis-heading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">MAP VIEWER</p>
            <h2 id="gis-heading" style="margin-bottom: 20px;">GIS</h2>

            <div class="gis-buttons">
              <button id="river-btn" class="gis-button">インドの川</button>
              <button id="soil-btn" class="gis-button">インドの土壌</button>
              <button id="religion-btn" class="gis-button">ITと宗教</button>
            </div>
          </div>
        </div>

        <p class="hint">地図上を操作して、気づいたことを<a href="after.html">メモ</a>しましょう。</p>
      </section>

      <div class="map-frame">
        <iframe id="gis-frame" title="授業で使うGIS地図" loading="lazy" allowfullscreen></iframe>
        <img id="gis-image" alt="GIS関連画像" style="display: none;" />
        <p id="gis-message" class="frame-message" role="status"></p>
      </div>
      
      <!-- <p class="small-note">地図が表示されない場合は、GIS側の共有設定や埋め込み許可を確認してください。</p> -->
    </section>
  </main>

  <footer class="site-footer">地理総合の学び</footer>
</body>
</html>
